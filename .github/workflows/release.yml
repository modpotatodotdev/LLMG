name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --verbose

    - name: Install cargo-edit
      run: cargo install cargo-edit

    - name: Get current version
      id: current
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Bump version
      id: bump
      run: |
        IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
        case "${{ inputs.bump }}" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac
        NEW_VERSION="${major}.${minor}.${patch}"
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

        # Update workspace version
        sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml

        # Update member crate versions
        for crate in llmg-core llmg-providers llmg-gateway; do
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" "$crate/Cargo.toml"
        done

        # Update internal dependency versions
        sed -i "s/llmg-core = { path = \"..\/llmg-core\", version = \".*\"/llmg-core = { path = \"..\/llmg-core\", version = \"$NEW_VERSION\"/" llmg-providers/Cargo.toml llmg-gateway/Cargo.toml 2>/dev/null || true
        sed -i "s/llmg-providers = { path = \"..\/llmg-providers\", version = \".*\"/llmg-providers = { path = \"..\/llmg-providers\", version = \"$NEW_VERSION\"/" llmg-gateway/Cargo.toml 2>/dev/null || true

    - name: Verify build
      run: cargo build --release

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit and tag
      run: |
        git add -A
        git commit -m "release: v${{ steps.bump.outputs.version }}"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin main --tags

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.bump.outputs.version }}"
        name: "v${{ steps.bump.outputs.version }}"
        generate_release_notes: true

    - name: Publish llmg-core to crates.io
      run: cargo publish -p llmg-core --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      continue-on-error: true

    - name: Publish llmg-providers to crates.io
      run: cargo publish -p llmg-providers --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      continue-on-error: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}},value=v${{ steps.bump.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=v${{ steps.bump.outputs.version }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
