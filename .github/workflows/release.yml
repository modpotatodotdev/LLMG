name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --verbose

    - name: Get current version
      id: current
      run: |
        # Read version from [workspace.package] section specifically
        VERSION=$(sed -n '/\[workspace\.package\]/,/\[/{ s/^version = "\(.*\)"/\1/p }' Cargo.toml)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Current version: $VERSION"

    - name: Bump version
      id: bump
      run: |
        IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
        case "${{ inputs.bump }}" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac
        NEW_VERSION="${major}.${minor}.${patch}"
        SHORT_VERSION="${major}.${minor}"
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "Bumping to: $NEW_VERSION (short: $SHORT_VERSION)"

        # ── 1. Workspace root version ──
        sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml

        # ── 2. Internal dependency version pins (llmg-xxx = { path = "...", version = "..." }) ──
        for f in llmg-providers/Cargo.toml llmg-gateway/Cargo.toml; do
          sed -i -E "s/(llmg-[a-z_]+ = \{ path = \"[^\"]+\", version = )\"[^\"]+\"/\1\"$NEW_VERSION\"/" "$f"
        done

        # ── 3. README.md version references ──
        sed -i -E "s/llmg-core = \"[0-9]+\.[0-9]+\"/llmg-core = \"$SHORT_VERSION\"/" README.md
        sed -i -E "s/(llmg-providers = \{ version = )\"[0-9]+\.[0-9]+\"/\1\"$SHORT_VERSION\"/" README.md

        # ── 4. Documentation version references (all .md/.mdx under docs/) ──
        find docs -type f \( -name "*.md" -o -name "*.mdx" \) | while read -r f; do
          # Cargo.toml-style: llmg-core = "0.1"
          sed -i -E "s/llmg-core = \"[0-9]+\.[0-9]+\"/llmg-core = \"$SHORT_VERSION\"/" "$f"
          # Cargo.toml-style: llmg-providers = { version = "0.1", ... }
          sed -i -E "s/(llmg-providers = \{ version = )\"[0-9]+\.[0-9]+\"/\1\"$SHORT_VERSION\"/" "$f"
          # JSON-style: "version": "0.1.0"
          sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$NEW_VERSION\"/" "$f"
        done

    - name: Verify build
      run: cargo build --release

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit and tag
      run: |
        git add -A
        git commit -m "release: v${{ steps.bump.outputs.version }}"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin ${{ github.ref_name }} --tags

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.bump.outputs.version }}"
        name: "v${{ steps.bump.outputs.version }}"
        generate_release_notes: true

    - name: Publish llmg-core to crates.io
      run: cargo publish -p llmg-core --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      continue-on-error: true

    - name: Publish llmg-providers to crates.io
      run: cargo publish -p llmg-providers --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      continue-on-error: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}},value=v${{ steps.bump.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=v${{ steps.bump.outputs.version }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
