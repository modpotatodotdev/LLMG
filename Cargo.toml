[workspace]
resolver = "2"
members = ["llmg-core", "llmg-providers", "llmg-gateway"]

[workspace.package]
version = "0.1.10"
edition = "2021"
authors = ["LLMG Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/modpotatodotdev/llmg"
readme = "README.md"
keywords = ["llm", "openai", "gateway", "ai", "rig"]
categories = ["api-bindings", "web-programming"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
